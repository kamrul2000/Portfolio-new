<section class="resume-cta section-padding" aria-labelledby="resume-title">
  <div class="container">
    <div class="resume-cta__panel" appReveal>
      <div class="resume-cta__bg" aria-hidden="true"></div>

      <div class="resume-cta__content">
        <span class="resume-cta__eyebrow">Resume</span>
        <h2 id="resume-title" class="resume-cta__title">
          Want to know more about my experience?
        </h2>
        <p class="resume-cta__text">
          Download my CV for a full breakdown of my roles, projects, and the technology I've shipped.
        </p>
      </div>

      <div class="resume-cta__actions">
        <a
          [href]="profile.resumePath"
          class="resume-cta__btn resume-cta__btn--primary"
          target="_blank"
          rel="noopener"
          download
          aria-label="Download Md. Kamrul Hassan Khan's resume PDF"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Download Resume
        </a>

        <a
          [href]="'mailto:' + profile.email"
          class="resume-cta__btn resume-cta__btn--ghost"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="m3 7 9 6 9-6"/>
          </svg>
          Get in touch
        </a>
      </div>
    </div>
  </div>
</section>
