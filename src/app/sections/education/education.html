<section id="education" class="education section-padding" aria-labelledby="education-title">
  <div class="container">

    <app-section-title
      eyebrow="Education"
      title="Academic background"
      subtitle="Where I built my foundation in computer science and engineering."
    />

    <ol class="education__list" appReveal>
      @for (item of items; track item.id) {
        <li class="education__row">
          <p class="education__duration">{{ item.duration }}</p>

          <div class="education__body">
            <h3 class="education__institution">{{ item.institution }}</h3>
            <p class="education__degree">{{ item.degree }}</p>
            @if (item.description) {
              <p class="education__description">{{ item.description }}</p>
            }
          </div>

          @if (item.grade) {
            <p class="education__grade">{{ item.grade }}</p>
          }
        </li>
      }
    </ol>
  </div>
</section>
