<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Project image coming soon">
  <defs>
    <linearGradient id="pf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#11172b"/>
    </linearGradient>
    <linearGradient id="pf-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="pf-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#pf-bg)"/>
  <rect width="800" height="500" fill="url(#pf-grid)"/>

  <!-- decorative blur orbs -->
  <circle cx="120" cy="100" r="120" fill="#6366f1" opacity="0.18"/>
  <circle cx="700" cy="420" r="160" fill="#06b6d4" opacity="0.16"/>

  <!-- mock window -->
  <g transform="translate(180 130)">
    <rect width="440" height="240" rx="14" fill="#1a2238" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="22" cy="22" r="6" fill="#ef4444"/>
    <circle cx="44" cy="22" r="6" fill="#f59e0b"/>
    <circle cx="66" cy="22" r="6" fill="#3b82f6"/>

    <rect x="22" y="58"  width="280" height="10" rx="5" fill="rgba(255,255,255,0.18)"/>
    <rect x="22" y="80"  width="220" height="10" rx="5" fill="rgba(255,255,255,0.10)"/>
    <rect x="22" y="102" width="320" height="10" rx="5" fill="rgba(255,255,255,0.10)"/>
    <rect x="22" y="124" width="180" height="10" rx="5" fill="rgba(255,255,255,0.10)"/>

    <rect x="22" y="170" width="120" height="36" rx="18" fill="url(#pf-accent)"/>
    <rect x="158" y="170" width="100" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)"/>
  </g>

  <text x="400" y="430" text-anchor="middle"
        font-family="'Inter', system-ui, sans-serif"
        font-weight="600" font-size="18" fill="rgba(255,255,255,0.55)" letter-spacing="3">
    PROJECT IMAGE COMING SOON
  </text>
</svg>
